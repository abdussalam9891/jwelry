<!doctype html>
<html lang="en">
 <head>
  <!-- Basic -->
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Shopping Cart | Gemora</title>

  <meta
    name="description"
    content="Review your selected jewellery items and proceed securely to checkout with Gemora." />

  <meta
    name="keywords"
    content="Gemora, shopping cart, jewellery cart, checkout" />

  <meta
    name="author"
    content="Gemora" />

  <meta
    name="robots"
    content="index, follow" />

  <meta
    name="theme-color"
    content="#6B1A2A" />

  <!-- Canonical -->
  <link
    rel="canonical"
    href="https://gemora-jwelry.vercel.app/pages/cart.html" />

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website" />

  <meta
    property="og:title"
    content="Shopping Cart | Gemora" />

  <meta
    property="og:description"
    content="Review your selected jewellery items before checkout." />

  <meta
    property="og:image"
    content="https://gemora-jwelry.vercel.app/src/assets/images/og-image.png" />

  <meta
    property="og:url"
    content="https://gemora-jwelry.vercel.app/pages/cart.html" />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image" />

  <meta
    name="twitter:title"
    content="Shopping Cart | Gemora" />

  <meta
    name="twitter:description"
    content="Review your selected jewellery items before checkout." />

  <meta
    name="twitter:image"
    content="https://gemora-jwelry.vercel.app/src/assets/images/og-image.png" />

  <!-- Performance -->
  <link
    rel="preconnect"
    href="https://res.cloudinary.com" />

  <!-- Favicon -->
  <link
    rel="icon"
    href="../src/assets/icon/logo.png" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Styles -->
  <link
    href="../src/css/main.css"
    rel="stylesheet" />

  <link
    rel="stylesheet"
    href="../src/css/navbar.css" />

  <link
    rel="stylesheet"
    href="../src/css/animations.css" />
</head>

  <body>
    <div id="navbar-container"></div>

    <main class="max-w-6xl mx-auto px-4 py-10 page-content">
      <!-- HEADER -->
      <div class="mb-8">
        <h1 class="text-2xl md:text-3xl font-semibold">
          My Cart
          <span
            id="cartCountText"
            class="text-black/60 text-lg font-normal ml-2"
          >
            0 items
          </span>
        </h1>
      </div>

      <!-- GRID -->
      <section>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- LEFT (Scrollable Cart Items) -->
          <div id="cartItems" class="lg:col-span-2 space-y-4"></div>

          <!-- RIGHT (Sticky Summary) -->
          <div id="summaryWrapper" class="lg:col-span-1">
            <div
              class="sticky top-24 bg-white border border-black/5 rounded-2xl p-5 shadow-sm"
            >
              <h2 class="text-[1.35rem] font-semibold mb-5">Order Summary</h2>

              <div id="summaryContent"></div>
            </div>
          </div>
        </div>
      </section>

      <div
        id="cartModal"
        class="modal-backdrop hidden fixed inset-0 bg-black/40 flex items-center justify-center z-[var(--z-modal)]"
      >
        <div class="modal-panel bg-white p-6 rounded-xl w-80">
          <h2 class="font-semibold mb-4">Remove item?</h2>

          <button
            id="confirmRemove"
            class="w-full bg-[#6B1A2A] hover:opacity-90 text-white py-2 rounded mb-2"
          >
            Remove
          </button>

          <button id="closeModal" class="w-full border py-2 rounded">
            Cancel
          </button>
        </div>
      </div>

      <div
        id="toast"
        class="hidden fixed bottom-5 right-5 bg-black text-white px-4 py-2 rounded-lg shadow-lg z-[var(--z-toast)]"
      ></div>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="../src/js/main.js"></script>
    <script type="module" src="../src/js/components/footer.js"></script>
    <script type="module">
      import { initCartPage } from "../src/js/pages/cartPage.js";

      initCartPage();
    </script>
  </body>
</html>
