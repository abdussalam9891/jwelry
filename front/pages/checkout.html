<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Checkout | Gemora</title>

    <meta
      name="description"
      content="Complete your jewellery purchase securely with Gemora."
    />

    <meta name="author" content="Gemora" />

    <meta name="robots" content="noindex, nofollow" />

    <meta name="theme-color" content="#6B1A2A" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://gemora-jwelry.vercel.app/pages/checkout.html"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Checkout | Gemora" />

    <meta
      property="og:description"
      content="Complete your jewellery purchase securely with Gemora."
    />

    <meta
      property="og:image"
      content="https://gemora-jwelry.vercel.app/src/assets/images/og-image.png"
    />

    <meta
      property="og:url"
      content="https://gemora-jwelry.vercel.app/pages/checkout.html"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Checkout | Gemora" />

    <meta
      name="twitter:description"
      content="Complete your jewellery purchase securely with Gemora."
    />

    <meta
      name="twitter:image"
      content="https://gemora-jwelry.vercel.app/src/assets/images/og-image.png"
    />

    <!-- Performance -->
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Favicon -->
    <link rel="icon" href="../src/assets/icon/logo.png" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Styles -->
    <link href="../src/css/main.css" rel="stylesheet" />

    <link rel="stylesheet" href="../src/css/navbar.css" />
    <link rel="stylesheet" href="../src/css/animations.css" />
  </head>

  <body>
    <div id="navbar-container"></div>

    <main class="max-w-6xl mx-auto px-4 py-10 page-content">
      <div class="mb-8">
        <h1 class="text-2xl md:text-3xl font-semibold">Checkout</h1>
      </div>

      <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- LEFT -->
        <div class="lg:col-span-2 space-y-6">
          <!-- ADDRESS -->
          <div class="bg-white border border-black/5 rounded-2xl p-5 shadow-sm">
            <div class="flex items-center justify-between mb-5">
              <h2 class="text-lg font-semibold">Select Delivery Address</h2>

              <button
                id="addAddressBtn"
                class="text-sm text-[#6B1A2A] font-medium"
              >
                + Add New Address
              </button>
            </div>

            <div id="addressContainer" class="space-y-4"></div>
          </div>

          <!-- PAYMENT -->
          <div class="bg-white border border-black/5 rounded-2xl p-5 shadow-sm">
            <h2 class="text-lg font-semibold mb-5">Payment Method</h2>

            <div id="paymentMethods" class="space-y-3">
              <!-- COD -->
              <label
                class="flex items-center justify-between border rounded-xl px-4 py-4 cursor-pointer hover:border-[#6B1A2A] transition"
              >
                <div class="flex items-center gap-3">
                  <input type="radio" name="payment" value="COD" checked />

                  <div>
                    <p class="font-medium">Cash on Delivery</p>

                    <p class="text-xs text-black/50">
                      Pay when your order arrives
                    </p>
                  </div>
                </div>
              </label>

              <label
                class="flex items-center justify-between border rounded-xl px-4 py-4 cursor-pointer hover:border-[#6B1A2A] transition"
              >
                <div class="flex items-center gap-3">
                  <input type="radio" name="payment" value="RAZORPAY" />

                  <div>
                    <p class="font-medium">Razorpay</p>

                    <p class="text-xs text-black/50">
                      UPI, Cards, NetBanking & Wallets
                    </p>
                  </div>
                </div>
              </label>
            </div>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="lg:col-span-1">
          <div
            class="sticky top-24 bg-white border border-black/5 rounded-2xl p-2 shadow-sm"
          >


          <!-- coupon section  -->
            <div id="couponSection" class="mb-5">
              <div id="availableCoupons"></div>
            </div>

            <h2 class="text-[1.35rem] font-semibold mb-5">Order Summary</h2>



            <div id="summaryContent"></div>

            <!-- place order button  -->
            <button
              id="placeOrderBtn"
              class="w-full h-12 rounded-xl bg-[#6B1A2A] text-white font-medium hover:opacity-90 transition mt-5"
            >
              Place Order
            </button>
          </div>
        </div>
      </section>
      <!-- address modal  -->
      <div
        id="addressModal"
        class="hidden fixed inset-0 bg-black/40 z-[var(--z-modal)] flex items-center justify-center p-4"
      >
        <div class="bg-white w-full max-w-lg rounded-2xl p-6 overflow-y-auto">
          <div class="flex items-center justify-between mb-5">
            <h2 id="addressModalTitle" class="text-xl font-semibold">
              Add Address
            </h2>

            <button
              id="closeAddressModal"
              type="button"
              class="w-9 h-9 rounded-full flex items-center justify-center text-xl text-black/50 hover:bg-black/5 transition"
            >
              ×
            </button>
          </div>

          <form id="addressForm" class="space-y-4">
            <input type="hidden" id="addressId" />

            <!-- Full Name -->
            <div>
              <label class="block text-sm font-medium mb-1">
                Full Name <span class="text-red-500">*</span>
              </label>

              <input
                id="fullName"
                placeholder="Enter full name"
                class="w-full border rounded-xl px-4 h-11"
                required
              />
            </div>

            <!-- Phone + Email -->
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">
                  Phone Number <span class="text-red-500">*</span>
                </label>

                <input
                  id="phone"
                  type="tel"
                  inputmode="numeric"
                  maxlength="10"
                  placeholder="Phone number"
                  class="w-full border rounded-xl px-4 h-11"
                  required
                />
              </div>

              <div>
                <label class="block text-sm font-medium mb-1">
                  Email
                  <span class="text-black/50 font-normal"> (Optional) </span>
                </label>

                <input
                  id="email"
                  type="email"
                  placeholder="your@email.com"
                  class="w-full border rounded-xl px-4 h-11"
                />
              </div>
            </div>

            <!-- Pincode + City -->
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">
                  Pincode <span class="text-red-500">*</span>
                </label>

                <input
                  id="pincode"
                  inputmode="numeric"
                  maxlength="6"
                  placeholder="Pincode"
                  class="w-full border rounded-xl px-4 h-11"
                  required
                />
              </div>

              <div>
                <label class="block text-sm font-medium mb-1">
                  City <span class="text-red-500">*</span>
                </label>

                <input
                  id="city"
                  placeholder="City"
                  class="w-full border rounded-xl px-4 h-11"
                  required
                />
              </div>
            </div>

            <!-- State + Address Type -->
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">
                  State <span class="text-red-500">*</span>
                </label>

                <input
                  id="state"
                  placeholder="State"
                  class="w-full border rounded-xl px-4 h-11"
                  required
                />
              </div>

              <div>
                <label class="block text-sm font-medium mb-1">
                  Address Type
                </label>

                <select
                  id="addressType"
                  class="w-full border rounded-xl px-4 h-11"
                >
                  <option value="HOME">Home</option>
                  <option value="WORK">Work</option>
                  <option value="OTHER">Other</option>
                </select>
              </div>
            </div>

            <!-- Address Line 1 -->
            <div>
              <label class="block text-sm font-medium mb-1">
                House / Flat / Building
                <span class="text-red-500">*</span>
              </label>

              <input
                id="addressLine1"
                placeholder="House / Flat / Building"
                class="w-full border rounded-xl px-4 h-11"
                required
              />
            </div>

            <!-- Address Line 2 + Landmark -->
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">
                  Address Line 2
                  <span class="text-black/50 font-normal"> (Optional) </span>
                </label>

                <input
                  id="addressLine2"
                  placeholder="Road / Area"
                  class="w-full border rounded-xl px-4 h-11"
                />
              </div>

              <div>
                <label class="block text-sm font-medium mb-1">
                  Landmark
                  <span class="text-black/50 font-normal"> (Optional) </span>
                </label>

                <input
                  id="landmark"
                  placeholder="Landmark"
                  class="w-full border rounded-xl px-4 h-11"
                />
              </div>
            </div>

            <button
              type="submit"
              class="w-full h-12 rounded-xl bg-[#6B1A2A] text-white font-medium hover:opacity-90 transition"
            >
              Save Address
            </button>
          </form>
        </div>
      </div>

      <div
        id="toast"
        class="hidden fixed bottom-5 right-5 bg-black text-white px-4 py-2 rounded-lg shadow-lg z-[var(--z-toast)]"
      ></div>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="../src/js/main.js"></script>
    <script type="module" src="../src/js/components/footer.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module">
      import "../src/js/pages/checkoutPage.js";
    </script>
  </body>
</html>
