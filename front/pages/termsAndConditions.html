<!doctype html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Terms & Conditions | Gemora</title>

  <meta
    name="description"
    content="Read the Terms & Conditions governing the use of the Gemora website, products, services, orders, and customer responsibilities." />

  <meta
    name="keywords"
    content="Gemora terms and conditions, terms of service, jewellery store policies, Gemora legal" />

  <meta
    name="author"
    content="Gemora" />

  <meta
    name="robots"
    content="index, follow" />

  <meta
    name="theme-color"
    content="#6B1A2A" />

  <!-- Canonical -->
  <link
    rel="canonical"
    href="https://gemora-jwelry.vercel.app/pages/terms.html" />

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website" />

  <meta
    property="og:title"
    content="Terms & Conditions | Gemora" />

  <meta
    property="og:description"
    content="Read Gemora's Terms & Conditions for using our website and services." />

  <meta
    property="og:image"
    content="https://gemora-jwelry.vercel.app/src/assets/images/hero.webp" />

  <meta
    property="og:url"
    content="https://gemora-jwelry.vercel.app/pages/terms.html" />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image" />

  <meta
    name="twitter:title"
    content="Terms & Conditions | Gemora" />

  <meta
    name="twitter:description"
    content="Read Gemora's Terms & Conditions." />

  <meta
    name="twitter:image"
    content="https://gemora-jwelry.vercel.app/src/assets/images/hero.webp" />

  <!-- Performance -->
  <link
    rel="preconnect"
    href="https://res.cloudinary.com" />

  <!-- Favicon -->
  <link
    rel="icon"
    href="../src/assets/icon/logo.png" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Styles -->
  <link
    href="../src/css/main.css"
    rel="stylesheet" />

  <link
    rel="stylesheet"
    href="../src/css/navbar.css" />

  <link
    rel="stylesheet"
    href="../src/css/animations.css" />
</head>
  <body>
    <div id="navbar-container"></div>

    <section class="bg-[#F9F6F2] py-28 mt-24">
  <div class="container-main max-w-2xl">
    <!-- Dynamic Page Title -->
    <h1
      id="page-title"
      class="text-[2.4rem] md:text-[2.8rem] font-light leading-tight mb-12"
    >
      Loading...
    </h1>

    <!-- CMS Content -->
    <div id="cms-content">
      <!-- Loading Skeleton -->
      <div class="animate-pulse space-y-8">
        <div class="h-5 w-1/3 rounded bg-black/10"></div>

        <div class="space-y-3">
          <div class="h-4 rounded bg-black/10"></div>
          <div class="h-4 rounded bg-black/10"></div>
          <div class="h-4 w-4/5 rounded bg-black/10"></div>
        </div>

        <div class="space-y-3">
          <div class="h-5 w-1/4 rounded bg-black/10"></div>
          <div class="h-4 rounded bg-black/10"></div>
          <div class="h-4 rounded bg-black/10"></div>
          <div class="h-4 w-3/4 rounded bg-black/10"></div>
        </div>

        <div class="space-y-3">
          <div class="h-5 w-1/5 rounded bg-black/10"></div>
          <div class="h-4 rounded bg-black/10"></div>
          <div class="h-4 rounded bg-black/10"></div>
          <div class="h-4 w-2/3 rounded bg-black/10"></div>
        </div>
      </div>
    </div>
  </div>
</section>

    <!-- footer  -->
    <div id="footer-container"></div>

    <script type="module" src="../src/js/main.js"></script>
    <script type="module" src="../src/js/pages/terms.js"></script>
    <script type="module" src="../src/js/components/footer.js"></script>
  </body>
</html>
