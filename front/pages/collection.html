<!doctype html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Jewellery Collection | Gemora</title>

  <meta
    name="description"
    content="Browse Gemora's premium jewellery collection including rings, necklaces, earrings, bracelets, and more. Crafted with elegance for every occasion." />

  <meta
    name="keywords"
    content="Gemora, jewellery collection, rings, necklaces, earrings, bracelets, premium jewellery, gold jewellery, silver jewellery" />

  <meta
    name="author"
    content="Gemora" />

  <meta
    name="robots"
    content="index, follow" />

  <meta
    name="theme-color"
    content="#6B1A2A" />

  <!-- Canonical -->
  <link
    rel="canonical"
    href="https://gemora-jwelry.vercel.app/pages/collections.html" />

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website" />

  <meta
    property="og:title"
    content="Jewellery Collection | Gemora" />

  <meta
    property="og:description"
    content="Explore Gemora's handcrafted premium jewellery collections." />

  <meta
    property="og:image"
    content="https://gemora-jwelry.vercel.app/src/assets/images/gemoraCollection.webp" />

  <meta
    property="og:url"
    content="https://gemora-jwelry.vercel.app/pages/collections.html" />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image" />

  <meta
    name="twitter:title"
    content="Jewellery Collection | Gemora" />

  <meta
    name="twitter:description"
    content="Explore Gemora's handcrafted premium jewellery collections." />

  <meta
    name="twitter:image"
    content="https://gemora-jwelry.vercel.app/src/assets/images/gemoraCollection.webp" />

  <!-- Performance -->
  <link
    rel="preconnect"
    href="https://res.cloudinary.com" />

  <!-- Favicon -->
  <link
    rel="icon"
    href="../src/assets/icon/logo.png" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Styles -->
  <link
    href="../src/css/main.css"
    rel="stylesheet" />

  <link
    rel="stylesheet"
    href="../src/css/navbar.css" />

  <link
    rel="stylesheet"
    href="../src/css/animations.css" />
</head>
  <body>
    <div id="navbar-container"></div>



 <main>

  <!-- HERO -->

<section
  id="collectionHero"
  class="
    relative
    mt-28
    h-[38svh]
    min-h-[320px]
    sm:h-[42svh]
    lg:h-[46svh]
    lg:min-h-[420px]
    overflow-hidden
  "
>

  <!-- Background -->
  <img
    id="heroImage"
    alt="collection hero"
    class="
      absolute
      inset-0
      w-full
      h-full
      object-cover
      scale-105
    "
  />

  <!-- Luxury Overlay -->
<div
  class="
    absolute
    inset-0
    bg-gradient-to-r
    from-black/65
    via-black/35
    to-black/5
  "
></div>

  <!-- Content -->
 <div
  class="
    container-main
    relative
    z-10
    flex
    h-full
    items-center
  "
>
  <div class="max-w-2xl">

    <h1
      id="heroTitle"
      class="
        text-4xl
        sm:text-5xl
        lg:text-6xl
        font-light
        text-white
        leading-tight
        mb-5
      "
    ></h1>

    <p
      id="heroDescription"
      class="
        max-w-xl
        text-base
        sm:text-lg
        text-white/85
        leading-relaxed
        mb-8
      "
    ></p>

 <div class="flex flex-wrap gap-3">

  <a
    href="#productsSection"
    class="
      rounded-full
      bg-white
      px-5
      py-2.5
      sm:px-7
      sm:py-3
      text-sm
      sm:text-base
      font-medium
      text-black
      transition
      hover:scale-[1.02]
    "
  >
    Explore Collection
  </a>

  <a
    href="/pages/products.html"
    class="
      rounded-full
      border
      border-white
      px-5
      py-2.5
      sm:px-7
      sm:py-3
      text-sm
      sm:text-base
      text-white
      transition
      hover:bg-white
      hover:text-black
    "
  >
    View All
  </a>

</div>

  </div>
</div>



</section>

  <!-- PRODUCTS -->

<section id="productsSection" class="py-24">
  <div class="container-main">

   <div
  class="flex items-center justify-between mb-12"
>

  <h2
    id="productsHeading"
    class="text-3xl font-light"
  ></h2>

  <div id="sortContainer"></div>

</div>

    <div
      id="productsGrid"
      class="grid grid-cols-2 lg:grid-cols-4 gap-8"
    ></div>

    <div class="mt-16">
      <div id="pagination"></div>
    </div>

  </div>
</section>

</main>










    <!-- footer  -->
    <div id="footer-container"></div>

    <script type="module" src="../src/js/main.js"></script>
    <script type="module" src="../src/js/pages/collectionPage.js"></script>

    <script type="module" src="../src/js/components/footer.js"></script>
  </body>
</html>
