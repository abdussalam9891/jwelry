<!doctype html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Shop Premium Jewellery | Gemora</title>

  <meta
    name="description"
    content="Browse Gemora's premium jewellery collection including rings, necklaces, bracelets and earrings. Discover handcrafted designs for every occasion." />

  <meta
    name="keywords"
    content="Gemora, jewellery, rings, necklaces, bracelets, earrings, premium jewellery, gold jewellery, silver jewellery, diamond jewellery" />

  <meta
    name="author"
    content="Gemora" />

  <meta
    name="robots"
    content="index, follow" />

  <meta
    name="theme-color"
    content="#6B1A2A" />

  <!-- Canonical -->
  <link
    rel="canonical"
    href="https://gemora-jwelry.vercel.app/pages/products.html" />

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website" />

  <meta
    property="og:title"
    content="Shop Premium Jewellery | Gemora" />

  <meta
    property="og:description"
    content="Explore handcrafted rings, necklaces, bracelets and earrings from Gemora." />

  <meta
    property="og:image"
    content="https://gemora-jwelry.vercel.app/src/assets/images/og-image.png" />

  <meta
    property="og:url"
    content="https://gemora-jwelry.vercel.app/pages/products.html" />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image" />

  <meta
    name="twitter:title"
    content="Shop Premium Jewellery | Gemora" />

  <meta
    name="twitter:description"
    content="Discover Gemora's premium jewellery collection." />

  <meta
    name="twitter:image"
    content="https://gemora-jwelry.vercel.app/src/assets/images/og-image.png" />

  <!-- Performance -->
  <link
    rel="preconnect"
    href="https://res.cloudinary.com" />

  <!-- Favicon -->
  <link
    rel="icon"
    href="../src/assets/icon/logo.png" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Styles -->
  <link
    href="../src/css/main.css"
    rel="stylesheet" />

  <link
    rel="stylesheet"
    href="../src/css/navbar.css" />

  <link
    rel="stylesheet"
    href="../src/css/animations.css" />

  <link
    rel="stylesheet"
    href="../src/css/products.css" />
</head>
  <body>
    <div id="navbar-container"></div>

<div class="page-content">

  <section
  class="
    container-main
    py-6
    md:py-8
  "
>

    <div id="collectionHeader"></div>

  </section>

  <section class="container-main pb-4">

  <div id="collectionBanner"></div>

</section>

  <section
   class="
  sticky
  top-[var(--navbar-h,0px)]

  z-[var(--z-sticky)]

  bg-white

  border-y
  border-black/5
"
  >
    <div class="container-main">

      <div id="filterBar"></div>

<div id="filterDropdowns"></div>

    </div>
  </section>

  <section class="container-main py-8">

    <div id="activeFilters"></div>



   <div
  id="productsGrid"
  class="
    grid
    grid-cols-2
    lg:grid-cols-3
    xl:grid-cols-4

    gap-x-8
    gap-y-14
  "
></div>

    <div id="pagination"></div>

  </section>


  <div
  id="filterOverlay"
  class="
    fixed
    inset-0
    bg-black/30
    backdrop-blur-sm
    hidden
    z-[var(--z-overlay)]
  "
></div>

<div
  id="mobileFilters"
  class="
    fixed
    top-0
    right-0
    h-full
    w-[90%]
    max-w-md

    bg-white

    shadow-2xl

    transition-transform
    duration-300

    translate-x-full

    z-[var(--z-drawer)]
  "
>

  <button
    id="closeFilters"
    type="button"
    aria-label="Close filters"
    class="absolute top-4 right-4 w-9 h-9 rounded-full flex items-center justify-center text-black/50 hover:bg-black/5 transition"
  >
    ✕
  </button>

</div>

    <!-- footer  -->
    <div id="footer-container"></div>

    <script type="module" src="../src/js/main.js"></script>
    <script type="module" src="../src/js/components/footer.js"></script>
    <script  type="module" src="../src/js/pages/products.js"></script>
  </body>
</html>
