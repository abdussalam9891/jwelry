<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Served by Vercel for any unknown URL, at any depth, so every
         path in this file must be absolute. -->
    <title>Page Not Found | Gemora</title>
    <meta
      name="description"
      content="The page you're looking for doesn't exist. Explore Gemora's handcrafted premium jewellery instead."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#6B1A2A" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />


    <link rel="stylesheet" href="/src/css/main.css" />
    <link rel="stylesheet" href="/src/css/navbar.css" />
    <link rel="stylesheet" href="/src/css/animations.css" />
    <!-- Tailwind (built by `npm run build:css`) -->
    <link rel="stylesheet" href="/src/css/tailwind.css" />
  </head>

  <body class="bg-[#F9F6F2]">
    <div id="navbar-container"></div>

    <main class="page-content container-main pb-24">
      <section
        class="mx-auto max-w-2xl flex flex-col items-center text-center hero-fade-in"
      >
        <p
          class="text-[7rem] md:text-[10rem] leading-none font-light text-[#6B1A2A]/15 select-none"
          style="font-family: 'Cormorant Garamond', serif"
          aria-hidden="true"
        >
          404
        </p>

        <h1
          class="-mt-6 md:-mt-10 text-[2.2rem] md:text-[3rem] font-light leading-tight text-[#1A1A1A]"
        >
          This piece seems to be missing
        </h1>

        <p class="mt-4 max-w-md text-black/60 leading-relaxed">
          The page you're looking for may have moved or no longer exists.
          Let's help you find something beautiful instead.
        </p>

        <div class="mt-10 flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
          <a
            href="/pages/products.html"
            class="btn-primary inline-flex items-center justify-center px-8 h-12"
          >
            Shop Jewellery
          </a>

          <a
            href="/index.html"
            class="inline-flex items-center justify-center px-8 h-12 rounded-xl border border-[#6B1A2A]/30 text-[#6B1A2A] hover:bg-[#6B1A2A]/5 transition"
          >
            Back to Home
          </a>
        </div>

        <nav aria-label="Popular categories" class="mt-14 w-full">
          <p class="text-xs uppercase tracking-[0.2em] text-black/40">
            Popular categories
          </p>

          <ul class="mt-4 flex flex-wrap justify-center gap-2">
            <li>
              <a
                href="/pages/products.html?category=rings"
                class="inline-block px-4 py-2 rounded-full bg-white border border-black/5 text-sm hover:border-[#6B1A2A]/30 transition"
                >Rings</a
              >
            </li>
            <li>
              <a
                href="/pages/products.html?category=earrings"
                class="inline-block px-4 py-2 rounded-full bg-white border border-black/5 text-sm hover:border-[#6B1A2A]/30 transition"
                >Earrings</a
              >
            </li>
            <li>
              <a
                href="/pages/products.html?category=neckwears"
                class="inline-block px-4 py-2 rounded-full bg-white border border-black/5 text-sm hover:border-[#6B1A2A]/30 transition"
                >Necklaces</a
              >
            </li>
            <li>
              <a
                href="/pages/products.html?category=bracelets"
                class="inline-block px-4 py-2 rounded-full bg-white border border-black/5 text-sm hover:border-[#6B1A2A]/30 transition"
                >Bracelets</a
              >
            </li>
            <li>
              <a
                href="/pages/contact.html"
                class="inline-block px-4 py-2 rounded-full bg-white border border-black/5 text-sm hover:border-[#6B1A2A]/30 transition"
                >Contact Us</a
              >
            </li>
          </ul>
        </nav>
      </section>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="/src/js/main.js"></script>
    <script type="module" src="/src/js/components/footer.js"></script>
  </body>
</html>
